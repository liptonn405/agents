[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miminet-coder-agent"
version = "0.1.0"
description = "Plan-driven, isolated OpenCode editing component"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
coder-agent = "coder_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["coder_agent*"]
